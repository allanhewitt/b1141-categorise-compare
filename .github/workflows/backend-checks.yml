name: Backend checks

on:
  push:
    branches:
      - stage3-candc-engine-build
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: b1141_categorise_compare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d b1141_categorise_compare_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/b1141_categorise_compare_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Check Stage 3 JavaScript syntax
        working-directory: backend
        run: |
          node --check lib/candc.js
          node --check stage3-candc.js
          node --check server-stage3.js
          node --check test/candc.test.js
          node --check test/candc-postgres.test.js

      - name: Run pure domain tests
        working-directory: backend
        run: node --test test/candc.test.js

      - name: Validate migration manifest hashes
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path('backend/migrations/manifest.json').read_text())
          for migration in manifest['migrations']:
              data = pathlib.Path(migration['path']).read_bytes()
              header = f"blob {len(data)}\0".encode()
              actual = hashlib.sha1(header + data).hexdigest()
              expected = migration['git_blob_sha']
              print(migration['id'], actual)
              if actual != expected:
                  print(f"hash mismatch: expected {expected}", file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Build fresh migrated test database
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/schema.sql
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          manifest = json.loads(pathlib.Path('backend/migrations/manifest.json').read_text())
          db = os.environ['TEST_DATABASE_URL']
          for migration in manifest['migrations']:
              print(f"Applying {migration['id']} {migration['filename']}")
              subprocess.run(['psql', db, '-v', 'ON_ERROR_STOP=1', '-f', migration['path']], check=True)
              actual = subprocess.check_output(['psql', db, '-At', '-c', migration['verify_sql']], text=True).strip()
              if actual != migration['verify_expected']:
                  print(f"verification failed for {migration['id']}: expected {migration['verify_expected']}, got {actual}", file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Run PostgreSQL-backed lifecycle tests
        working-directory: backend
        run: node --test test/candc-postgres.test.js

      - name: Audit production backend dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
